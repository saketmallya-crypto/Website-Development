<!DOCTYPE html>
<html>
    <head>
        <title>Array</title>
    </head>
    <body>
        <script>
            for (var count=0;count<=10;count++){
                document.write(count);
            }
            var fruits=["apple","mango","orange","banana"];
            for(var count=0;count<fruits.length;count++){
                document.write(fruits[count]);
                document.write("<br>");
            }
        </script>
    </body>
</html>
