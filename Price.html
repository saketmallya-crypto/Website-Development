<!DOCTYPE html>
<html>
    <body>
        <input type="text"id="fare">
        <input type="text" id="tax">
        <button onclick="calculate()"> Calcuate Total Price</button>
        <h1 id="output"></h1>
        <script>
           function calculate(){
            try{
                var fare=document.getElementById("fare").value;
             var tax=document.getElementById("tax").value;
             // typecasting
             fare=Number(fare);
             tax=Number(tax);
              if(isNaN(fare)||isNaN(tax)){
                throw new Error("Please enter a numeric value")     
                     
            }
            if (fare<0||tax<0){
                throw new Error("Fare cannot be negative")
            }

            var total=fare+tax;
           document.getElementById("output").innerText=total;
            }
              catch(error){
                document.getElementById("output").innerHTML=error.message;
              }
           }
           
        </script>
    </body>
</html>
