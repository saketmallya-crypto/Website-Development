<!DOCTYPE html>
<html>
    <body>
        <script>
            document.write(Math.abs(-5));
            document.write("<br>");
            document.write(Math.max(56,77));

            document.write(Math.min(74,9));

            var radian=degree*(Math.PI/180);
            document.write(Math.sin(radian));
        </script>
    </body>
