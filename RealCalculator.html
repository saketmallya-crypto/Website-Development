<!DOCTYPE html>
<html>
    <head>
        <title>Calculator</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <style>
            #display{
                width:400px;
                padding:5px;
            }
            
            
            .container{
                width:500px;
                padding:4px;
                border-radius:20px;
                text-align:center;
                margin-top: 50px;
            }
            .number{
                background:cadetblue;
                
            }
            .operator{
                background:off whitesmoke;
                border:2px solid cadetblue;
            }
            .btn:hover{
                background:cornflowerblue;
            }
        </style>
    </head>
    <body>
        <div class="container-fluid bg-info p-3 text-center">
            <h1 class="display-1">Calculator</h1>
            <p class="lead"> This is a small project where I have used HTML,CSS and JavaScript to make a calculator</p>
        </div>
        <div class="container">
            <div class="row">
                <input type="text" id="display" disabled>
            </div>
            <div class="row">
                <button class=" col-3 btn btn-light number" onclick="addvalue('7')">7</button>
                <button class="col-3 btn btn-light number" onclick="addvalue('8')">8</button>
                <button class="col-3 btn btn-light number" onclick="addvalue('9')">9</button>
                <button class="col-3 btn btn-light operator" onclick="addvalue('+')">+</button>
            </div>
            <div class="row">
                <button class="col-3 btn btn-light number" onclick="addvalue('4')">4</button>
                <button class="col-3 btn btn-light number" onclick="addvalue('5')">5</button>
                <button class="col-3 btn btn-light number" onclick="addvalue('6')">6</button>
                <button class="col-3 btn btn-light operator" onclick="addvalue('-')">-</button>
            </div>
            <div class="row">
                <button class="col-3 btn btn-light number" onclick="addvalue('1')">1</button>
                <button class="col-3 btn btn-light number" onclick="addvalue('2')">2</button>
                <button class="col-3 btn btn-light number" onclick="addvalue('3')">3</button>
                <button class="col-3 btn btn-light operator" onclick="addvalue('*')">x</button>
            </div>
            <div class="row">
                <button class="col-3 btn btn-warning" onclick="result()">=</button>
                <button class="col-3 btn btn-light number" onclick="addvalue('0')">0</button>
                <button class="col-3 btn btn-danger" onclick="clearvalue()">C</button>
                <button class="col-3 btn btn-light operator" onclick="addvalue('/')">/</button>
            </div>
        </div>
        <script>
            let display=document.getElementById("display");
            function addvalue(value){
                display.value=display.value+value;
            }
            function clearvalue(){
                display.value="";
            }
            function result(){
                display.value=eval(display.value);
                try{
                    display.value=eval(display.value);
                }
                catch{
                    display.value="error";
                }
            }
        </script>
    </body>
</html>
