                <button class="col-3 btn btn-light" onclick="addvalue('*')">X</button>
            </div>
            <div class="row">
                <button class="col-3 btn btn-warning" onclick="addvalue('=')">=</button>
                <button class="col-3 btn btn-light" onclick="addvalue('0')">0</button>
                <button class="col-3 btn btn-danger" onclick="clearvalue()">C</button>
                <button class="col-3 btn btn-light" onclick="addvalue('/')">/</button>
            </div>
