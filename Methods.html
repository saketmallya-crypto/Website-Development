<!DOCTYPE html>
<html>
    <head>
        <title>Methods</title>
    </head>
    <body>
        <script>
            let country="India";
            document.write(country.toUpperCase());
            document.write(country.toLowerCase());
            document.write("<br>");
            document.write (country.startsWith("i"));
            document.write("<br>");
            document.write(Math.abs(-5));
            document.write("<br>");
            document.write(Math.random());
            document.write("<br>");
            document.write(Math.floor(5.763452));
            document.write("<br>")
            document.write(Math.max(5,7));
        </script>
    </body>
</html>
