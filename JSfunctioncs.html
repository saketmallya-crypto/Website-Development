<!DOCTYPE html>
<html>
    <head>
        <title>Functions in Java Script</title>
    </head>
    <body>
        <div>
            <h2 id="name">Dear</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Labore, possimus. Cum totam, consequatur dolorem dolores ad dolorum vel quibusdam iure tempora obcaecati aliquid veritatis reprehenderit, delectus natus! Laudantium, eum eligendi?</p>
        </div>
    </body>
    <script>
        function invitation_card(name){
            document.getElementById("name").innerHTML+=name;
        }
        //calling function
        invitation_card("Saket");
    </script>
</html>
