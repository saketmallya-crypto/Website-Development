<!DOCTYPE html>
<html>
    <body>
        <script>
            function add(n1,n2,n3){
                let sum=n1+n2+n3;
                return sum;

            }
            function average(n1,n2,n3){
                let avg=add(n1,n2,n3)/3;
                return avg;
            }
            document.write(average (5,6,7));
        </script>
    </body>
</html>
