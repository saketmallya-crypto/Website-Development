<!DOCTYPE html>
<html>
    <head>
       <title>Book Flights</title> 
       <style>
        .cards{
            width: 300px;
            height: 150px;
            background-color: antiquewhite;
            border-radius: 20%;
            text-align: center;
            padding:4px;
            box-shadow: 2px 3px 2px cornflowerblue;
            margin: 10px;
        }
        #flightcontainer{
            display:flex ;
            justify-content:center;
            align-items: center;
            flex-direction: column;

        }
        .container{
            display:flex;
            justify-content: center;
            align-items: center;
            
        }
        .container button{
            background-color: rgba(85, 209, 251, 0.551);
            border-radius: 20%;
            padding: 10px;
            width: 120px;
            height:50px;
            margin: 3px;
        }
       h2{
        
         display:flex;
         justify-content: center;
            align-items: center;
            font-size: 75px;
            color:rgb(67, 98, 235)   ;
       }
       </style>
    </head>
    <body>
        <h2>Book Your Flights</h2>
        <div class="container">
             <button onclick="lowtohigh()">Prices Low to High</button>
            <button onclick="hightolow()">Prices High to Low</button>
            <button onclick="sortairline()">Sort By Airline</button>
        </div>
         
           
        <div id="flightcontainer">
           
        </div>
        <script>
             var flights=[
                {
                flightno:"AI202",
                airline:"Air India",
                price:8000,
                from:"Calicut",
                to:"Bangalore",
            },
             {
                flightno:"6E798",
                airline:"Indigo",
                price:7500,
                from:"Calicut",
                to:"Delhi",
            },
             {
                flightno:"AX121",
                airline:"Air India Express",
                price:8000,
                from:"Calicut",
                to:"Dubai",
            },
             
        ]
        //sorting from low to high
           
            //sorting from high to low
           
            
            function displayflights(){
                let data=flights.map(
                    (flights)=>{
                        return `<div class="cards">
            <h3>${ flights.airline}</h3>
            <p>
                ${flights.from}- ${flights.to}
            </p>
            <p class="price"> ${flights.price}</p>
            <button>Book Now</button>
            </div>`;
                    }
                );
                 document.getElementById("flightcontainer").innerHTML=data.join("");
            };
            displayflights();
             function lowtohigh(){
                flights.sort((a,b)=>a.price-b.price);
                displayflights();
            }
             function hightolow(){
                flights.sort((a,b)=>b.price-a.price);
                displayflights();
            }
            function sortairline(){
                flights.sort((a,b)=>a.airline.localeCompare(b.airline));
                displayflights()
            }
        </script>
    </body>
</html>
